  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "excluded" list.
#
# Listed files are relative to the Jekyll project root.
#
# The following items are always excluded by default and cannot be removed from
# the excluded list:
#
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/
#
# To exclude other items, add them to the list below.
#
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - bin/
  - docker-compose.yml
  - Dockerfile
  - README.md
  - LICENSE

